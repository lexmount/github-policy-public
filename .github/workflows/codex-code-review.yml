# Generated by python3 ocr/render_workflow.py; edit ocr/ci_client.py.
name: OCR Dispatch

on:
  pull_request_target:

permissions: {}

concurrency:
  group: ocr-org-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-review:
    name: OCR dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit PR and confirm durable acceptance (90 seconds maximum)
        env:
          OCR_CI_TOKEN: ${{ secrets.OCR_CI_TOKEN }}
        shell: bash
        run: |
          python3 - <<'OCR_PY'
          # SPDX-License-Identifier: Apache-2.0
          """Trusted workflow client; never check out or execute pull request code."""
          from datetime import datetime, timezone
          import hashlib
          import http.client
          import json
          import os
          import random
          import re
          import signal
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE_URL = 'https://n8n.cross.lexmount.cn/webhook/'
          SCHEMA = 'ocr-ci/v1'
          WAIT_STATES = {'accepted', 'dispatching', 'queued', 'running', 'retrying'}
          FAIL_STATES = {'failed', 'cancelled', 'superseded'}
          TIMEOUT = 90
          MAX_ATTEMPTS = 4
          MAX_RESPONSE_BYTES = 65536


          class ReviewError(Exception):
              def __init__(self, message, code='invalid_response'):
                  super().__init__(message)
                  self.code = code


          _telemetry = None


          class Telemetry:
              def __init__(self):
                  self.started = time.monotonic()
                  self.sequence = 0
                  self.finished = False
                  self.context = {key: os.environ.get(env) for key, env in [
                      ('repository', 'GITHUB_REPOSITORY'), ('repository_id', 'GITHUB_REPOSITORY_ID'),
                      ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'),
                      ('job', 'GITHUB_JOB'), ('workflow_ref', 'GITHUB_WORKFLOW_REF')]}

              def emit(self, event, **fields):
                  self.sequence += 1
                  record = {**self.context, **fields, 'schema': 'ocr-policy-telemetry/v1',
                            'event': event, 'sequence': self.sequence,
                            'at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')}
                  try:
                      print(json.dumps(record, sort_keys=True), flush=True)
                  except OSError:
                      # Observability must not change the admission result.
                      pass

              def finish(self, outcome, reason=None):
                  if self.finished:
                      return
                  self.finished = True
                  self.emit('ocr_client_result', outcome=outcome, reason=reason,
                            elapsed_ms=round((time.monotonic() - self.started) * 1000))



          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def coordinates(event, env):
              if env.get('GITHUB_EVENT_NAME') != 'pull_request_target':
                  raise ReviewError('Only pull_request_target is supported; merge queues are not supported.')
              repo = env.get('GITHUB_REPOSITORY', '')
              if not re.fullmatch(r'lexmount/[A-Za-z0-9_.-]+', repo, re.I):
                  raise ReviewError('This workflow is for the lexmount organization.')
              pull = event.get('pull_request', {})
              number = pull.get('number')
              if type(number) is not int or number <= 0 or pull.get('state') != 'open':
                  raise ReviewError('An open pull request is required.')
              base = pull.get('base', {})
              if base.get('repo', {}).get('full_name', '').lower() != repo.lower():
                  raise ReviewError('Pull request base repository does not match the workflow repository.')
              head_sha, base_sha = pull.get('head', {}).get('sha', ''), base.get('sha', '')
              if not all(re.fullmatch('[0-9a-f]{40}', s) for s in [head_sha, base_sha]):
                  raise ReviewError('Missing immutable PR head/base SHA.')
              if not isinstance(base.get('ref'), str) or not base['ref']:
                  raise ReviewError('Missing PR base branch.')
              return {'repository': repo.lower(), 'pull_number': number, 'head_sha': head_sha,
                      'base_sha': base_sha, 'base_ref': base['ref']}


          def request_id(identity):
              payload = json.dumps(identity, sort_keys=True, separators=(',', ':')).encode()
              return 'ocr-ci-' + hashlib.sha256(payload).hexdigest()


          def check_identity(reply, identity):
              if not isinstance(reply, dict) or reply.get('schema') != SCHEMA:
                  raise ReviewError('Unexpected OCR response schema.')
              for key, value in identity.items():
                  if type(reply.get(key)) is not type(value) or reply[key] != value:
                      raise ReviewError('OCR result does not match this PR snapshot: ' + key)
              if reply.get('request_id') != request_id(identity):
                  raise ReviewError('OCR receipt does not match the submitted request.')


          def verdict(reply):
              state = reply.get('state')
              if reply.get('contract_version') == 2:
                  if state not in WAIT_STATES | FAIL_STATES | {'complete', 'skipped'}:
                      raise ReviewError('Unknown OCR task state.')
                  if reply.get('acceptance') != 'accepted' or reply.get('scheduler') != 'backend' or reply.get('durable') is not True:
                      raise ReviewError('Backend did not accept responsibility for this task.')
                  if not isinstance(reply.get('task_id'), str) or not reply['task_id'].strip():
                      raise ReviewError('Missing durable OCR task ID.')
                  return 0
              if state in FAIL_STATES:
                  raise ReviewError('OCR task failed: ' + state)
              if state not in WAIT_STATES | {'complete', 'skipped'}:
                  raise ReviewError('Unknown OCR task state.')
              if reply.get('durable') is not True or reply.get('status_published') is not True:
                  return None
              task_id = reply.get('task_id')
              if not isinstance(task_id, str) or not task_id.strip():
                  raise ReviewError('Missing durable OCR task ID.')
              expected = {'success', 'failure'} if state in {'complete', 'skipped'} else {'pending'}
              if reply.get('commit_status') not in expected:
                  raise ReviewError('Missing authoritative OCR commit status.')
              # This gate confirms dispatch only. Rulesets may separately require ocr-review to enforce the verdict.
              return 0


          def timeout_handler(signum, frame):
              raise ReviewError('OCR acceptance exceeded 90 seconds; re-run to reuse the task.', 'ack_deadline_exceeded')


          def log_request(path, payload, attempt, started, status, error=None, retry_delay=None, error_code=None):
              record = {'event': 'ocr_gateway_request', 'operation': path,
                        'request_id': payload.get('request_id'), 'attempt': attempt,
                        'elapsed_ms': round((time.monotonic() - started) * 1000),
                        'http_status': status, 'error': error, 'retry_delay_seconds': retry_delay}
              record['error_code'] = error_code
              if _telemetry:
                  _telemetry.emit(**record)
              else:
                  print(json.dumps(record, sort_keys=True), flush=True)


          def post(path, payload, token, deadline):
              data = json.dumps(payload).encode()
              for attempt in range(MAX_ATTEMPTS):
                  started = time.monotonic()
                  remaining = deadline - started
                  if remaining <= 0:
                      raise ReviewError('Timed out waiting for OCR. Re-run this workflow to reuse the task.', 'ack_deadline_exceeded')
                  status = None
                  req = urllib.request.Request(BASE_URL + path, data=data, headers={
                      'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
                  try:
                      with urllib.request.build_opener(NoRedirect).open(req, timeout=min(15, remaining)) as response:
                          status = response.status
                          length = response.headers.get('Content-Length')
                          if length is not None:
                              length = length.strip()
                          if length is not None and (not length.isascii() or not length.isdecimal()):
                              raise ReviewError('OCR returned an invalid response length.')
                          expected = int(length) if length is not None else None
                          if expected is not None and expected > MAX_RESPONSE_BYTES:
                              raise ReviewError('OCR response exceeds the allowed size.')
                          raw = response.read(MAX_RESPONSE_BYTES + 1)
                          if len(raw) > MAX_RESPONSE_BYTES:
                              raise ReviewError('OCR response exceeds the allowed size.')
                          # A bounded read may return a short body without raising IncompleteRead.
                          if expected is not None and len(raw) < expected:
                              raise http.client.IncompleteRead(raw, expected - len(raw))
                          reply = json.loads(raw)
                  except urllib.error.HTTPError as error:
                      status = error.code
                      error.close()
                      if status not in [408, 429, 500, 502, 503, 504]:
                          log_request(path, payload, attempt + 1, started, status, 'HTTPError', error_code='http_error')
                          raise ReviewError(f'OCR gateway HTTP {status}; check configuration and credentials.', 'http_error') from None
                      failure, failure_code = 'HTTPError', 'http_error'
                  except (urllib.error.URLError, ConnectionError, TimeoutError,
                          ssl.SSLEOFError, http.client.IncompleteRead, http.client.BadStatusLine,
                          json.JSONDecodeError, UnicodeError) as error:
                      failure = type(error).__name__
                      cause = error.reason if isinstance(error, urllib.error.URLError) else error
                      failure_code = 'http_timeout' if isinstance(cause, TimeoutError) else 'transport_error'
                  except ReviewError as error:
                      log_request(path, payload, attempt + 1, started, status, 'ReviewError', error_code=error.code)
                      raise
                  else:
                      log_request(path, payload, attempt + 1, started, status)
                      return reply
                  remaining = max(0, deadline - time.monotonic())
                  delay = None
                  if attempt + 1 < MAX_ATTEMPTS and remaining > 0:
                      backoff = 2 ** attempt
                      delay = min(random.uniform(backoff / 2, backoff), remaining)
                  log_request(path, payload, attempt + 1, started, status, failure, delay, failure_code)
                  if delay is None:
                      break
                  time.sleep(delay)
              raise ReviewError('OCR gateway remains unavailable after bounded retries; re-run this workflow.', 'gateway_retries_exhausted')


          def summary(identity, reply):
              skipped = reply.get('state') == 'skipped' and reply.get('reason') == 'repository_not_enabled'
              heading = 'OCR dispatch skipped' if skipped else 'OCR dispatch accepted'
              if skipped:
                  details = 'Automatic review is disabled for this repository. Dispatch skipped by repository policy.\n'
              else:
                  details = ('Task persisted. The backend owns dispatch, recovery and result publication.\n'
                             'The separate ocr-review status reports the review verdict; enforcement is configured in Rulesets.\n')
              text = (f"## {heading}\n\nRepository: `{identity['repository']}`; PR #{identity['pull_number']}\n\n"
                      f"Head: `{identity['head_sha']}`\n\n"
                      + details)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                      output.write(text)


          def submit():
              token = os.environ.get('OCR_CI_TOKEN', '').strip()
              if not token:
                  raise ReviewError('Missing organization secret OCR_CI_TOKEN or repository access to it.', 'configuration_error')
              with open(os.environ['GITHUB_EVENT_PATH']) as source:
                  identity = coordinates(json.load(source), os.environ)
              receipt = {'schema': SCHEMA, 'request_id': request_id(identity), **identity}
              if _telemetry:
                  _telemetry.context.update({**identity, 'request_id': receipt['request_id']})
                  _telemetry.emit('ocr_client_started')
              payload = {**receipt, 'source': {'run_id': os.environ.get('GITHUB_RUN_ID'),
                                             'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                                             'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF')}}
              run_id, run_attempt = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('GITHUB_RUN_ATTEMPT', '')
              if run_id.isdecimal() and run_attempt.isdecimal() and int(run_attempt) > 1:
                  payload['retry_key'] = run_id + ':' + run_attempt
              deadline = time.monotonic() + TIMEOUT
              reply = post('ocr-ci-submit', payload, token, deadline)
              last_state = None
              while True:
                  check_identity(reply, identity)
                  result = verdict(reply)
                  state = reply['state']
                  if state != last_state:
                      print('OCR dispatch state: ' + state, flush=True)
                      last_state = state
                  if result is not None:
                      skipped = state == 'skipped' and reply.get('reason') == 'repository_not_enabled'
                      if _telemetry:
                          _telemetry.finish('skipped' if skipped else 'accepted', 'repository_not_enabled' if skipped else None)
                      summary(identity, reply)
                      if state == 'skipped' and reply.get('reason') == 'repository_not_enabled':
                          print('OCR dispatch skipped: repository_not_enabled.')
                      else:
                          print('OCR dispatch accepted; the separate ocr-review status reports the review verdict.')
                      return result
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise ReviewError('OCR acceptance exceeded 90 seconds. Re-run to reuse the task.', 'ack_deadline_exceeded')
                  time.sleep(min(5, remaining))
                  reply = post('ocr-ci-status', receipt, token, deadline)


          def main():
              global _telemetry
              previous = _telemetry
              _telemetry = Telemetry()
              try:
                  return submit()
              except ReviewError as error:
                  _telemetry.finish('timeout' if error.code == 'ack_deadline_exceeded' else 'failed', error.code)
                  raise
              except Exception:
                  _telemetry.finish('failed', 'client_error')
                  raise
              finally:
                  _telemetry = previous


          if __name__ == '__main__':
              try:
                  # Ubuntu runner: enforce total wall time even on trickling HTTP bodies.
                  signal.signal(signal.SIGALRM, timeout_handler)
                  signal.setitimer(signal.ITIMER_REAL, TIMEOUT)
                  try:
                      result = main()
                  finally:
                      signal.setitimer(signal.ITIMER_REAL, 0)
                  sys.exit(result)
              except ReviewError as error:
                  print('::error::' + str(error), file=sys.stderr)
                  sys.exit(1)
          OCR_PY
